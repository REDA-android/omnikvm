[workspace]
resolver = "2"

[package]
name = "omnikvm-desktop"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1.41", features = ["rt-multi-thread"] }
kvm-tray-ui = { path = "../crates/kvm-tray-ui" }
