[workspace]
members = [
    "crates/kvm-omni-core",
    "crates/kvm-input-hal",
    "crates/kvm-clipboard-sync",
    "crates/kvm-transport-quic",
    "crates/kvm-transport-webrtc",
    "crates/kvm-discovery-mdns",
    "crates/kvm-mobile-bridge",
    "crates/kvm-esp32-hid",
    "crates/kvm-cli",
    "crates/kvm-tray-ui",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["OmniKVM Engineering Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
blake3 = "1.5"
crc32c = "0.6"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
qrcode = "0.14"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
bytes = "1.7"
